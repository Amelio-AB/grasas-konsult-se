name: Publicera Gräsås webbplats via FTPS

on:
  push:
    branches:
      - main
    paths:
      - "deploy/grasas/index.html"
      - "deploy/grasas/robots.txt"
      - "deploy/grasas/sitemap.xml"
      - "deploy/grasas/images/**"
      - "scripts/build_grasas_logos.py"
      - "scripts/deploy_grasas_ftps.py"
      - ".github/workflows/deploy-grasas-ftps.yml"
  workflow_dispatch:
    inputs:
      sync_images:
        description: "Uppdatera logotyper också?"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: grasas-inleed-ftps
  cancel-in-progress: false

jobs:
  deploy:
    name: Bygg och publicera startsida och SEO-filer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hämta webbplatsfilen
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Avgör om logotyper behöver överföras
        id: assets
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "sync_images=${{ inputs.sync_images }}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -Eq '^(deploy/grasas/images/|scripts/build_grasas_logos.py)'; then
            echo "sync_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "sync_images=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Välj Python för bildgenerering
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Skapa WebP från transparenta SVG-original
        if: steps.assets.outputs.sync_images == 'true'
        run: |
          python -m pip install --quiet --disable-pip-version-check "CairoSVG>=2.8,<3" "Pillow>=12,<13"
          python scripts/build_grasas_logos.py

      - name: Kontrollera att rätt webbhotell används
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          if [[ "$FTP_HOST" != "ns14.inleed.net" ]]; then
            echo "::error::FTP_HOST pekar inte på Görans nya server ns14.inleed.net. Ingen fil överfördes."
            exit 1
          fi
          if [[ "$FTP_USERNAME" != "ftp@grasaskonsult.se" ]]; then
            echo "::error::FTP-användarnamnet matchar inte Görans konto. Ingen fil överfördes."
            exit 1
          fi

      - name: Publicera krypterat via Inleed FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
          FTP_SYNC_IMAGES: ${{ steps.assets.outputs.sync_images }}
        run: python scripts/deploy_grasas_ftps.py

      - name: Verifiera startsida, robots och sitemap på den publika domänen
        shell: bash
        run: |
          set -euo pipefail
          for file in "" "robots.txt" "sitemap.xml"; do
            output="/tmp/grasas-${file:-index}.check"
            curl --fail --silent --show-error --location \
              --retry 4 --retry-delay 4 --max-time 30 \
              "https://grasaskonsult.se/${file}" --output "$output"
          done
          grep -Fq 'rel="canonical" href="https://grasaskonsult.se/"' /tmp/grasas-index.check
          if grep -qi 'noindex' /tmp/grasas-index.check; then
            echo "::error::Skarpa startsidan innehåller noindex"
            exit 1
          fi
          grep -Fq 'Sitemap: https://grasaskonsult.se/sitemap.xml' /tmp/grasas-robots.txt.check
          grep -Fq '<loc>https://grasaskonsult.se/</loc>' /tmp/grasas-sitemap.xml.check
          headers="$(curl --fail --silent --show-error --head \
            --location --max-time 25 https://grasaskonsult.se/)"
          if echo "$headers" | grep -Eiq '^x-robots-tag:.*noindex'; then
            echo "::error::HTTP-header blockerar indexering"
            exit 1
          fi
          echo "OK: HTTP, HTTPS, canonical, robots och sitemap kontrollerade."

